name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate JSON
        run: |
          python3 -m json.tool plugins/codex-discord/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/codex-discord/hooks/hooks.json >/dev/null
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null

      - name: Verify bundled runtime parity
        run: |
          diff -ru --exclude=__pycache__ \
            codex_discord \
            plugins/codex-discord/runtime/codex_discord

      - name: Run offline tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          unset CODEX_DISCORD_WEBHOOK_URL
          unset CODEX_DISCORD_MENTION_USER_ID
          unset CODEX_DISCORD_STATE_FILE
          python3 -m unittest discover -s tests -v
